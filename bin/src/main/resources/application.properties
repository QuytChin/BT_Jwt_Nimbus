spring.application.name=BT_JWT_NIMBUS_24110171
spring.config.import=optional:classpath:application-local.properties
server.port=8080

# UTF-8 cho tiếng Việt
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8

# =========================================================
# SQL SERVER
# Project tự tạo database nếu chưa tồn tại.
# Chỉ cần SQL Server đang chạy và tài khoản có quyền CREATE DATABASE.
# =========================================================
app.database.host=${DB_HOST:localhost}
app.database.port=${DB_PORT:1433}
app.database.name=${DB_NAME:jwt_nimbus_24110171}
app.database.username=${DB_USERNAME:sa}
app.database.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Nimbus - HS256
security.jwt.secret-key=${JWT_SECRET:}
security.jwt.expiration-time=3600000

# Demo account auto-created on startup
app.demo.enabled=true
app.demo.email=chien@gmail.com
app.demo.password=123456
app.demo.full-name=Tr\u1EA7n Quy\u1EBFt Chi\u1EBFn
app.demo.images=tran-quyet-chien.jpg

server.error.include-message=always
